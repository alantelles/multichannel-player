<section class="fx-dialog">
  <header class="fx-header">
    <div>
      <span class="fx-eyebrow">MASTER</span>
      <h2 mat-dialog-title>Efeitos</h2>
    </div>
    <button class="close-button" type="button" aria-label="Fechar efeitos" (click)="fechar()">×</button>
  </header>

  <div class="rack-actions" role="group" aria-label="Ações do rack de efeitos">
    <button type="button" (click)="salvarEfeitos()">Salvar</button>
    <button type="button" (click)="usarEfeitosSalvos()">Usar salvo</button>
    <button
      type="button"
      [class.is-active]="audio.masterEffectsBypassed()"
      [attr.aria-pressed]="audio.masterEffectsBypassed()"
      [attr.aria-label]="audio.masterEffectsBypassed() ? 'Desativar bypass geral' : 'Ativar bypass geral'"
      (click)="alternarBypassEfeitos()">
      {{ audio.masterEffectsBypassed() ? 'Ligar efeitos' : 'Desligar efeitos' }}
    </button>
  </div>
  <p class="action-message" aria-live="polite">{{ actionMessage() }}</p>

  <div mat-dialog-content class="fx-effects">
    @for (effectComponent of effectComponents; track effectComponent) {
      <ng-container *ngComponentOutlet="effectComponent"></ng-container>
    }
  </div>
</section>
