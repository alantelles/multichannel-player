<div class="app-container" [class.is-inverted]="paginaInvertida()" (click)="fecharMenuAoClicarFora($event)">
	<header class="app-header">
		<a class="brand" routerLink="/" (click)="fecharMenu()">
			<img ngSrc="/vamp-logo-smaller.png" width="171" height="50" alt="Vamp" priority>
		</a>

		<button
			class="menu-toggle"
			type="button"
			aria-controls="main-navigation"
			[attr.aria-expanded]="menuAberto()"
			[attr.aria-label]="menuAberto() ? 'Fechar menu' : 'Abrir menu'"
			(click)="menuAberto.update(aberto => !aberto)">
			<span></span>
			<span></span>
			<span></span>
		</button>

		<nav
			id="main-navigation"
			class="main-navigation"
			aria-label="Navegação principal"
			[class.is-open]="menuAberto()">
			<a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page" (click)="fecharMenu()">Mixer</a>
			<a routerLink="/criar-projeto" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="fecharMenu()">Criar projeto</a>
			<a routerLink="/projetos" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="fecharMenu()">Admin de projetos</a>
			<a routerLink="/configuracoes" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="fecharMenu()">Configurações</a>
			<button class="about-button" type="button" (click)="abrirSobre()">Sobre</button>
			<button
				class="page-inversion-toggle"
				type="button"
				[attr.aria-pressed]="paginaInvertida()"
				(click)="alternarInversao()">
				{{ paginaInvertida() ? 'Restaurar tela' : 'Inverter tela' }}
			</button>
		</nav>
	</header>

	<router-outlet></router-outlet>
</div>
